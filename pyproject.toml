[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t-res"
version = "0.1.0"
description = "Independent simulator telemetry dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
t-res = "t_res.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
