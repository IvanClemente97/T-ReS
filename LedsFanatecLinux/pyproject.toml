[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leds-fanatec-linux"
version = "0.1.0"
description = "Servicio y GUI independiente para los LED RGB y display Fanatec"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
leds-fanatec-service = "leds_fanatec_linux.service:main"
leds-fanatec-gui = "leds_fanatec_linux.gui:main"
leds-fanatec-diagnose = "leds_fanatec_linux.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]
